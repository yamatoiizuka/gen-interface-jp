name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; main deploys queue instead
# of being cancelled mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Run Python tests
        run: uv run --frozen --extra dev pytest

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Pages artifact
        run: make site

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
